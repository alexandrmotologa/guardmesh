services:
  guardmesh:
    image: guardmesh:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: guardmesh-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_OPENAI=https://api.openai.com
      - UPSTREAM_ANTHROPIC=https://api.anthropic.com
    volumes:
      - ./sample_guardmesh.yaml:/app/guardmesh.yaml:ro
      - guardmesh-data:/app/data
    command: ["start", "--config", "/app/guardmesh.yaml", "--db", "/app/data/guardmesh.db"]

volumes:
  guardmesh-data:
