name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Binary (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_name: guardmesh-linux-amd64
          - os: linux
            arch: arm64
            binary_name: guardmesh-linux-arm64
          - os: darwin
            arch: amd64
            binary_name: guardmesh-darwin-amd64
          - os: darwin
            arch: arm64
            binary_name: guardmesh-darwin-arm64
          - os: windows
            arch: amd64
            binary_name: guardmesh-windows-amd64.exe

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Build Web UI Distribution
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile guardmesh Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.binary_name }} ./cmd/guardmesh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Assets for Release
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
